services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booksmith
      POSTGRES_USER: booksmith
      POSTGRES_PASSWORD: booksmith_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgres://booksmith:booksmith_dev@postgres:5432/booksmith
      REDIS_URL: redis://redis:6379
      PORT: 4000
    depends_on:
      - postgres
      - redis

  workers:
    build:
      context: .
      dockerfile: packages/workers/Dockerfile
    environment:
      DATABASE_URL: postgres://booksmith:booksmith_dev@postgres:5432/booksmith
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  booking-page:
    build:
      context: .
      dockerfile: packages/booking-page/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - booking-page

volumes:
  postgres_data:
  redis_data:
  caddy_data:
